[package]
name = "gretl-sys"
version = "0.0.0"
edition = "2024"
publish = false
description = "Low-level FFI bindings to libgretl (gretl 2026b) for the TabDat estimator-backend spike"
build = "build.rs"
links = "gretl"

[features]
shared-plugins = []
count-plugin = ["shared-plugins"]
tobit-plugin = ["shared-plugins"]
quantile-plugin = ["shared-plugins"]

[lib]
path = "src/lib.rs"
