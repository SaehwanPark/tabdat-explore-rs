[package]
name = "tabdat-gretl-spike"
version = "0.0.0"
edition = "2024"
publish = false
description = "Safe facade over libgretl OLS for the TabDat estimator-backend feasibility spike"

[features]
count-plugin = ["gretl-sys/count-plugin"]
tobit-plugin = ["gretl-sys/tobit-plugin"]

[dependencies]
gretl-sys = { path = "gretl-sys", version = "=0.0.0" }

[workspace]

[lib]
path = "src/lib.rs"

[[bin]]
name = "tobit-measure"
path = "src/bin/tobit-measure.rs"
required-features = ["tobit-plugin"]
