[package]
name = "tabdat-gretl-spike"
version = "0.0.0"
edition = "2024"
publish = false
description = "Safe facade over libgretl OLS for the TabDat estimator-backend feasibility spike"

[features]
count-plugin = ["gretl-sys/count-plugin"]
tobit-plugin = ["gretl-sys/tobit-plugin"]
quantile-plugin = ["gretl-sys/quantile-plugin"]
survival-plugin = ["gretl-sys/survival-plugin"]
heckman-plugin = ["gretl-sys/heckman-plugin"]
dpanel-plugin = ["gretl-sys/dpanel-plugin"]

[dependencies]
gretl-sys = { path = "gretl-sys", version = "=0.0.0" }

[workspace]

[lib]
path = "src/lib.rs"

[[bin]]
name = "tobit-measure"
path = "src/bin/tobit-measure.rs"
required-features = ["tobit-plugin"]

[[bin]]
name = "quantile-measure"
path = "src/bin/quantile-measure.rs"
required-features = ["quantile-plugin"]

[[bin]]
name = "survival-measure"
path = "src/bin/survival-measure.rs"
required-features = ["survival-plugin"]

[[bin]]
name = "heckman-measure"
path = "src/bin/heckman-measure.rs"
required-features = ["heckman-plugin"]
