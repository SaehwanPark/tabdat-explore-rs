name: ReadStat feasibility spike

on:
  pull_request:
    paths:
      - ".github/workflows/readstat-spike.yml"
      - "SPEC.md"
      - "docs/TABDAT_RUST_PORT_ROADMAP.md"
      - "docs/adr/0004-readstat-feasibility.md"
      - "docs/feasibility/readstat.md"
      - "spikes/readstat-prototype/**"
      - "rust-toolchain.toml"
      - "rustfmt.toml"
      - "deny.toml"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/readstat-spike.yml"
      - "SPEC.md"
      - "docs/TABDAT_RUST_PORT_ROADMAP.md"
      - "docs/adr/0004-readstat-feasibility.md"
      - "docs/feasibility/readstat.md"
      - "spikes/readstat-prototype/**"
      - "rust-toolchain.toml"
      - "rustfmt.toml"
      - "deny.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: readstat-spike-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: ReadStat spike on Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Fetch and verify ReadStat release
        shell: bash
        run: |
          set -euo pipefail
          url="https://github.com/WizardMac/ReadStat/releases/download/v1.0.0/readstat-1.0.0.tar.gz"
          sha256="7635c73dd04532dbfa785c0485dbd6d52d86bc23030a1227e4a5a77a83824b84"
          curl --fail --silent --show-error --location "$url" --output /tmp/readstat.tar.gz
          echo "$sha256  /tmp/readstat.tar.gz" | sha256sum --check --status
          rm -rf /tmp/readstat
          mkdir -p /tmp/readstat
          tar --extract --gzip --file /tmp/readstat.tar.gz --strip-components=1 --directory /tmp/readstat
      - name: Build and test ReadStat
        working-directory: /tmp/readstat
        run: |
          ./configure --disable-shared --enable-static
          cflags='-Wno-error=stringop-truncation -Wno-error=use-after-free -Wno-error=format-truncation'
          make -j2 libreadstat.la CFLAGS="$cflags"
          make check CFLAGS="$cflags"
  rust-spike:
    name: ReadStat Rust spike on Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install repository-pinned toolchain
        run: rustup show active-toolchain
      - name: Check spike formatting
        run: cargo fmt --manifest-path spikes/readstat-prototype/Cargo.toml -- --check
      - name: Run spike tests (builds vendored ReadStat via build.rs)
        run: cargo test --manifest-path spikes/readstat-prototype/Cargo.toml --locked
        env:
          CARGO_TARGET_DIR: target/readstat-spike
