name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust baseline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install repository-pinned toolchain
        run: rustup show active-toolchain
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check all targets
        run: cargo check --locked --workspace --all-targets
      - name: Test all targets
        run: cargo test --locked --workspace --all-targets
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

  security:
    name: Dependency and unsafe-code policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install pinned policy tools
        run: |
          cargo install cargo-deny --version 0.20.2 --locked
          cargo install cargo-audit --version 0.22.2 --locked
          cargo install cargo-geiger --version 0.13.0 --locked
      - name: Check dependency policy
        run: cargo deny check
      - name: Audit advisories and yanked crates
        run: cargo audit -D warnings
      - name: Report unsafe code
        shell: bash
        run: |
          set -euo pipefail
          reports_dir="$(mktemp -d)"
          trap 'rm -rf "$reports_dir"' EXIT
          cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[].manifest_path' \
            | while IFS= read -r manifest; do
                package_name="$(cargo metadata --no-deps --format-version 1 \
                  --manifest-path "$manifest" | jq -r '.packages[0].name')"
                report="$reports_dir/$package_name.json"
                set +e
                cargo geiger \
                  --manifest-path "$manifest" \
                  --all-dependencies \
                  --all-targets \
                  --locked \
                  --output-format Json >"$report"
                geiger_status=$?
                set -e

                owned_count="$(jq --arg package "$package_name" \
                  '[.packages[] | select(.package.id.name == $package)] | length' "$report")"
                if [[ "$owned_count" != "1" ]]; then
                  echo "::error::cargo geiger did not report exactly one first-party package: $package_name"
                  exit 1
                fi
                if ! jq -e --arg package "$package_name" '
                  [.packages[] | select(.package.id.name == $package)][0]
                  | (.unsafety.forbids_unsafe == true)
                    and ([(.unsafety.used | to_entries[] | .value.unsafe_ // 0)] | all(. == 0))
                ' "$report" >/dev/null; then
                  echo "::error::first-party unsafe code detected in $package_name"
                  jq --arg package "$package_name" \
                    '[.packages[] | select(.package.id.name == $package)]' "$report"
                  exit 1
                fi
                if [[ "$geiger_status" -ne 0 ]]; then
                  echo "::warning::cargo geiger reported unsafe dependency inventory for $package_name (exit $geiger_status); first-party package is clean"
                fi
              done
