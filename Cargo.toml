[package]
name = "tabdat-explore-rs"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
tabdat-shell = { path = "crates/tabdat-shell", version = "0.1.0" }

[dev-dependencies]
serde_json = { version = "1.0", features = ["arbitrary_precision"] }
tabdat-domain = { path = "crates/tabdat-domain", version = "0.1.0" }
tabdat-language = { path = "crates/tabdat-language", version = "0.1.0" }
tabdat-runtime = { path = "crates/tabdat-runtime", version = "0.1.0" }
tabdat-execution = { path = "crates/tabdat-execution", version = "0.1.0" }
tabdat-reporting = { path = "crates/tabdat-reporting", version = "0.1.0" }
tabdat-mcp = { path = "crates/tabdat-mcp", version = "0.1.0" }

[workspace]
members = [
  ".",
  "crates/tabdat-domain",
  "crates/tabdat-execution",
  "crates/tabdat-data",
  "crates/tabdat-io",
  "crates/tabdat-reporting",
  "crates/tabdat-shell",
  "crates/tabdat-mcp",
  "crates/tabdat-language",
  "crates/tabdat-runtime",
  "crates/tabdat-stats",
]
exclude = [
  "spikes/duckdb-prototype",
  "spikes/readstat-prototype",
  "spikes/gretl-prototype",
  "spikes/native-svg-prototype",
]
resolver = "3"
